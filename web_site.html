<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>찐로컬 맛집,여가 찐이다!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;500;700&family=IBM+Plex+Sans+KR:wght@300;400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#D9E3DA;
  --land:#EDF2EC;
  --sea:#CDDCD8;
  --ink:#16283F;
  --ink-soft:#5C6E75;
  --punch:#B0313B;
  --line:#9BAFA0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper);
  background-image:repeating-linear-gradient(90deg,rgba(22,40,63,.03) 0 1px,transparent 1px 4px);
  color:var(--ink);font-family:"IBM Plex Sans KR",sans-serif;font-weight:300;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

/* ---------- 헤더 ---------- */
header{border-bottom:1.5px solid var(--ink);padding:12px 26px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;flex-shrink:0}
.brand{font-family:"Hahmlet",serif;font-weight:700;letter-spacing:.04em;font-size:16px}
.brand b{color:var(--punch)}
.brand small{display:block;font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:9.5px;letter-spacing:.22em;color:var(--ink-soft);margin-top:2px}
.picker{display:flex;align-items:center;gap:10px}
.picker label{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.2em;color:var(--ink-soft)}
select{
  font:inherit;font-size:14px;padding:8px 34px 8px 14px;cursor:pointer;
  background:var(--land) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7'><path d='M0 0h11L5.5 7z' fill='%2316283F'/></svg>") no-repeat right 13px center;
  border:1.5px solid var(--ink);color:var(--ink);border-radius:0;appearance:none;
}
select:focus-visible{outline:2px solid var(--punch);outline-offset:2px}

/* ---------- 레이아웃 ---------- */
.stage{display:grid;grid-template-columns:1fr 372px;flex:1;min-height:0}
.mapbox{position:relative;border-right:1.5px solid var(--ink);overflow:hidden;background:var(--sea);min-height:0}
svg.map{display:block;width:100%;height:100%;cursor:grab}
svg.map.dragging{cursor:grabbing}
#viewport{transition:transform .9s cubic-bezier(.4,0,.2,1)}
.nomotion #viewport{transition:none}

/* 지도 요소 */
.nk{fill:#C4D2C9;stroke:var(--line);stroke-width:1}
.sk{fill:var(--land);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.dmz{stroke:var(--punch);stroke-width:1.4;stroke-dasharray:5 4;fill:none;opacity:.65}
.route-bg{fill:none;stroke:var(--line);stroke-width:2.4;stroke-dasharray:6 5;stroke-linecap:round}
.route-done{fill:none;stroke:var(--punch);stroke-width:2.6;stroke-linecap:round}
.stn-hit{fill:transparent;cursor:pointer}
.stn-dot{fill:var(--land);stroke:var(--ink);stroke-width:2;transition:fill .25s,stroke .25s}
.stn-lab{font-family:"Hahmlet",serif;font-weight:500;font-size:14px;fill:var(--ink);pointer-events:none}
.stn-sub{font-family:"IBM Plex Mono",monospace;font-size:7.5px;letter-spacing:.14em;fill:var(--ink-soft);pointer-events:none}
.stn.visited .stn-dot{fill:var(--punch);stroke:var(--punch)}
.stn.here .stn-dot{fill:var(--punch);stroke:var(--ink);stroke-width:2.6}
.stn:hover .stn-dot{fill:var(--punch)}
.stn:hover .stn-lab{fill:var(--punch)}
.stn.here .ring{stroke:var(--punch);fill:none;stroke-width:1.4;opacity:.55;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{r:9;opacity:.6}100%{r:22;opacity:0}}
.jeju{fill:var(--land);stroke:var(--ink);stroke-width:1.2}
.jeju-lab{font-family:"IBM Plex Mono",monospace;font-size:7px;letter-spacing:.16em;fill:var(--ink-soft)}
.nk-lab{font-family:"IBM Plex Mono",monospace;font-size:8px;letter-spacing:.3em;fill:#8B9C90}

/* 줌 컨트롤 */
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:-1px}
.zoom button{
  width:40px;height:40px;font:inherit;font-size:18px;cursor:pointer;
  background:var(--land);border:1.5px solid var(--ink);margin-bottom:-1.5px;color:var(--ink);
  display:grid;place-content:center;transition:background .18s,color .18s;
}
.zoom button:last-child{font-size:9px;letter-spacing:.08em;font-family:"IBM Plex Mono",monospace}
.zlev{
  width:40px;height:24px;display:grid;place-content:center;font-size:9px;letter-spacing:.02em;
  background:var(--land);border:1.5px solid var(--ink);margin-bottom:-1.5px;color:var(--ink-soft);
}
.zoom button:hover{background:var(--ink);color:var(--land)}
.hint{
  position:absolute;left:16px;bottom:16px;font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;letter-spacing:.14em;color:var(--ink-soft);background:rgba(237,242,236,.85);
  padding:6px 11px;border:1px solid var(--line);
}

/* ---------- 요약 패널 ---------- */
.panel{background:var(--land);display:flex;flex-direction:column}
.p-status{
  padding:14px 24px;border-bottom:1.5px solid var(--ink);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.18em;color:var(--ink-soft);
}
.p-status b{color:var(--punch);font-weight:600}
.p-body{padding:30px 24px;flex:1;min-height:0;overflow-y:auto}
.p-seq{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.24em;color:var(--ink-soft)}
.p-name{font-family:"Hahmlet",serif;font-weight:700;font-size:52px;line-height:1.02;letter-spacing:-.02em;margin:8px 0 4px}
.p-name b{color:var(--punch)}
.p-line{font-size:13px;color:var(--ink-soft);letter-spacing:.02em}
.p-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.p-facts div span{display:block;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.18em;color:var(--ink-soft)}
.p-facts div strong{font-family:"Hahmlet",serif;font-weight:500;font-size:17px}
.p-facts div strong.sm{font-size:14px;line-height:1.3;display:inline-block;margin-top:3px}
.p-memo{font-size:14px;color:#33495C;border-left:2px solid var(--punch);padding-left:14px;margin-bottom:24px}
.p-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:26px}
.p-tags span{border:1px solid var(--line);padding:5px 12px;font-size:12px;letter-spacing:.02em}
.p-cta{
  width:100%;font:inherit;font-size:13px;font-weight:600;letter-spacing:.1em;cursor:pointer;
  background:var(--ink);color:var(--land);border:none;padding:15px;transition:background .2s;
}
.p-cta:hover{background:var(--punch)}
.fade{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ---------- 상세 ---------- */
.sheet{position:fixed;inset:0;z-index:90;display:none}
.sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(22,40,63,.42);backdrop-filter:blur(3px)}
.sheet-in{
  position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);
  background:var(--land);border-left:1.5px solid var(--ink);overflow-y:auto;
  animation:slide .38s cubic-bezier(.3,.9,.3,1);
}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
.sheet-head{padding:26px 32px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;position:sticky;top:0;background:var(--land);z-index:2}
.sheet-head h2{font-family:"Hahmlet",serif;font-weight:700;font-size:36px;line-height:1.05}
.sheet-head p{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.2em;color:var(--ink-soft);margin-top:6px}
.closebtn{font:inherit;font-size:22px;line-height:1;background:none;border:1.5px solid var(--ink);width:38px;height:38px;cursor:pointer;color:var(--ink);flex-shrink:0}
.closebtn:hover{background:var(--ink);color:var(--land)}
.sheet-body{padding:28px 32px 60px}
.sec-lab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.24em;color:var(--punch);border-bottom:1px solid var(--line);padding-bottom:8px;margin:36px 0 22px}
.sec-lab:first-child{margin-top:0}
.shop{border-left:2px solid var(--punch);padding-left:16px;margin-bottom:30px}
.shop h3{font-family:"Hahmlet",serif;font-weight:500;font-size:22px}
.shop .kind{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-soft);margin:2px 0 9px}
.shop p{font-size:14px;color:#33495C}
.shop .again{display:inline-block;margin-top:10px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;border:1px solid var(--line);padding:3px 10px;color:var(--ink-soft)}
.shop-imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.shop-imgs img{width:100%;height:170px;object-fit:cover;border:1.5px solid var(--ink);display:block;background:var(--sea)}

@media (max-width:920px){
  body{height:auto;overflow:visible;display:block}
  .stage{grid-template-columns:1fr;display:grid}
  .mapbox{border-right:none;border-bottom:1.5px solid var(--ink);height:58vh}
  .p-name{font-size:42px}
  header{padding:12px 18px}
  .picker{width:100%}
  select{flex:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">찐로컬 맛집,여가 <b>찐이다!</b><small>G팀 OPENCLASS · 찐로컬 노선도 · 9 STATIONS</small></div>
  <div class="picker">
    <label for="sel">목적지</label>
    <select id="sel"></select>
  </div>
</header>

<div class="stage">

  <div class="mapbox">
    <svg class="map" id="svg" viewBox="118 22 306 580" preserveAspectRatio="xMidYMid meet" role="img" aria-label="찐로컬 맛집·여가 노선도">

    <div class="zoom">
      <button id="zin" aria-label="확대">+</button>

    <div class="p-body" id="pbody"></div>
  </aside>

</div>

<!-- 상세 -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-in">
    <div class="sheet-head">
      <div><h2 id="shTitle"></h2><p id="shSub"></p></div>
      <button class="closebtn" data-close aria-label="닫기">×</button>
    </div>
    <div class="sheet-body" id="shBody"></div>
  </div>
</div>

/* ================== 노선 경로 ================== */
function smooth(pts){
  let d = `M ${pts[0].x} ${pts[0].y}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
    d+=` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2.x} ${p2.y}`;
  }
  return d;
}

  for(let l=0;l<=TOTAL;l+=1){
    const p=route.getPointAtLength(l);

    if(dd<bd){bd=dd;best=l;}
  }
  return best;
});

}
document.getElementById('zin').onclick =()=>setZoom(scale*1.55, route.getPointAtLength(curLen));
document.getElementById('zout').onclick=()=>setZoom(scale/1.55, route.getPointAtLength(curLen));
document.getElementById('zreset').onclick=()=>setZoom(1);

const svgEl=document.getElementById('svg');
svgEl.addEventListener('wheel',e=>{
  e.preventDefault();
  setZoom(scale * (e.deltaY<0?1.16:1/1.16), route.getPointAtLength(curLen));
},{passive:false});

/* 확대 상태에서 끌어서 이동 */
let drag=null;
svgEl.addEventListener('pointerdown',e=>{
  if(scale<=1 || e.target.closest('.stn')) return;
  drag={sx:e.clientX, sy:e.clientY, fx, fy, k:VB.w/svgEl.getBoundingClientRect().width};
  viewport.style.transition='none';
  svgEl.classList.add('dragging'); svgEl.setPointerCapture(e.pointerId);
});
svgEl.addEventListener('pointermove',e=>{
  if(!drag) return;
  fx = drag.fx - (e.clientX-drag.sx)*drag.k/scale;
  fy = drag.fy - (e.clientY-drag.sy)*drag.k/scale;
  applyView();
});
['pointerup','pointercancel'].forEach(t=>svgEl.addEventListener(t,()=>{
  if(!drag) return;
  drag=null; viewport.style.transition=''; svgEl.classList.remove('dragging');
}));

/* ================== 이동 ================== */
let cur=0, curLen=LEN[0], curAng=0, anim=null;

function drawTrain(len, ang){
  const p=route.getPointAtLength(len);
  const inv=1/scale;
  tr.setAttribute('transform',`translate(${p.x},${p.y}) scale(${inv}) rotate(${ang})`);
  routeDone.style.strokeDashoffset = TOTAL - len;
}
function angleAt(len){
  const a=route.getPointAtLength(Math.max(0,len-2));
  const b=route.getPointAtLength(Math.min(TOTAL,len+2));
  return Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
}

const stat=document.getElementById('stat');
const prog=document.getElementById('prog');

function goTo(i, openDetail){
  if(i===cur && !anim){ if(openDetail) openSheet(i); return; }
  cancelAnimationFrame(anim);
  const from=curLen, to=LEN[i], dist=Math.abs(to-from);
  const dur = RM ? 0 : Math.min(3400, 700 + dist*3.2);
  const t0=performance.now();
  const dir = to>from ? '남행' : '북행';
  stat.innerHTML = `<b>운행 중</b> · ${S[cur].n} → ${S[i].n} · ${dir}`;
  markers.forEach(m=>m.classList.remove('here'));

  function frame(t){
    const k = dur===0 ? 1 : Math.min(1,(t-t0)/dur);
    const e = k<.5 ? 2*k*k : 1-((-2*k+2)**2)/2;   // ease-in-out
    curLen = from + (to-from)*e;
    curAng = angleAt(curLen) + (to<from?180:0);
    drawTrain(curLen, curAng);
    if(scale>1){ const p=route.getPointAtLength(curLen); fx=p.x; fy=p.y; applyView(); }
    if(k<1){ anim=requestAnimationFrame(frame); }
    else{
      anim=null; cur=i;
      arrive(i);
      if(openDetail) setTimeout(()=>openSheet(i), 180);
    }
  }
  anim=requestAnimationFrame(frame);
}

function arrive(i){
  const s=S[i];
  stat.innerHTML = `<b>정차 중</b> · ${s.st}`;
  prog.textContent = `${i+1} / 9`;
  document.getElementById('sel').value = i;
  markers.forEach((m,j)=>{
    m.classList.toggle('here', j===i);
    m.classList.toggle('visited', j<=i);
  });
  renderPanel(i);
}

/* ================== 패널 ================== */
const pbody=document.getElementById('pbody');
function renderPanel(i){
  const s=S[i];
  pbody.innerHTML = `
    <div class="fade">
      <p class="p-seq">STOP ${String(i+1).padStart(2,'0')} · ${s.st.toUpperCase()}</p>
      <h2 class="p-name">${s.n}<b>역</b></h2>
      <p class="p-line">${s.line}</p>
      <div class="p-facts">
        <div><span>서울 기점</span><strong>${s.km} km</strong></div>
        <div><span>발표</span><strong class="sm">${s.pres}</strong></div>
        <div><span>기록한 곳</span><strong>${s.shops.length+s.spots.length}곳</strong></div>
      </div>
      <p class="p-memo">${s.memo}</p>
      <div class="p-tags">${s.tags.map(t=>`<span>${t}</span>`).join('')}</div>
      <button class="p-cta" id="cta">${s.n} 찐 맛집·여가 보기</button>
    </div>`;
  document.getElementById('cta').onclick=()=>openSheet(i);
}

/* ================== 상세 ================== */
const sheet=document.getElementById('sheet');
function shopHTML(sh){
  return `
    <article class="shop">
      <h3>${sh.n}</h3>
      <p class="kind">${sh.k}</p>
      <p>${sh.d}</p>
      <span class="again">📍 ${sh.addr}</span>
      ${sh.img.length ? `<div class="shop-imgs">${sh.img.map(f=>`<img src="images/${f}" alt="${sh.n}" loading="lazy">`).join('')}</div>` : ''}
    </article>`;
}
function openSheet(i){
  const s=S[i];
  document.getElementById('shTitle').textContent = `${s.n}, 여가 찐이다!`;
  document.getElementById('shSub').textContent = `${s.st} · ${s.line} · 발표 ${s.pres}`;
  document.getElementById('shBody').innerHTML =
    `<p class="sec-lab">찐 맛집 — ${s.shops.length}곳</p>` +
    s.shops.map(shopHTML).join('') +
    (s.spots.length ? `<p class="sec-lab">찐 여가 — ${s.spots.length}곳</p>` + s.spots.map(shopHTML).join('') : '');
  sheet.classList.add('open');
  sheet.querySelector('.closebtn').focus();
}
sheet.addEventListener('click',e=>{ if(e.target.hasAttribute('data-close')) sheet.classList.remove('open'); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') sheet.classList.remove('open'); });

/* ================== 드롭다운 ================== */
const sel=document.getElementById('sel');
sel.innerHTML = S.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${s.n} — ${s.st}</option>`).join('');
sel.onchange = e => goTo(+e.target.value, false);

/* ================== 시작 ================== */
applyView();
curAng = angleAt(LEN[0]);
drawTrain(LEN[0], curAng);
arrive(0);
</script>
</body>
</html>
